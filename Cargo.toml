# [workspace]
# members = ["crates/*"]

# [workspace.dependencies]
# bevy = { version = "0.19.0", default-features = false, features = ["3d", "audio", "ui"] }

[package]
name = "prop-hunt"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = { version = "0.7.0", features = ["enhanced-determinism", "serialize"] }
# bevy.workspace = true
bevy = { version = "0.19.0", default-features = false, features = ["3d", "audio", "bevy_feathers", "debug", "free_camera", "ui"] }
bevy-inspector-egui = "0.37.0"
bevy_hanabi = { version = "0.19.0", default-features = false, features = ["3d"] }
bevy_tweening = { git = "https://github.com/Brayan-724/bevy_tweening", default-features = false, features = ["bevy_ui"] }
leafwing-input-manager = "0.21.0"
lightyear = { version = "0.28.0", features = ["avian3d", "crossbeam", "deterministic", "frame_interpolation", "leafwing", "netcode", "steam", "udp", "websocket"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
