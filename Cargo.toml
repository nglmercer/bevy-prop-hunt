# [workspace]
# members = ["crates/*"]

# [workspace.dependencies]
# bevy = { version = "0.19.0", default-features = false, features = ["3d", "audio", "ui"] }

[package]
name = "prop-hunt"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.7.0"
# bevy.workspace = true
bevy = { version = "0.19.0", default-features = false, features = ["3d", "audio", "bevy_feathers", "debug", "free_camera", "ui"] }
bevy_hanabi = { version = "0.19.0", default-features = false, features = ["3d"] }
bevy_tweening = { git = "https://github.com/Brayan-724/bevy_tweening", default-features = false, features = ["bevy_ui"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
